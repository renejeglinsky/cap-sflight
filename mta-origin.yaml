_schema-version: "3.2"
ID: capire.sflight
version: 1.0.0
description: "CAP SFlight with Embedded Analytics, single-tenant, Node"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx -p "@sap/cds-dk@^8" cds build --profile production,node-st


modules:
  # --------------------- SERVER MODULE ------------------------
  - name: sflight-srv-node
  # ------------------------------------------------------------
    type: nodejs
    path: gen/srv
    requires:
      - name: sflight-db
      - name: sflight-uaa
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    build-parameters:
      builder: custom
      commands:
        - npm ci

  # -------------------- HDI DEPLOYER --------------------------
  - name: sflight-db-deployer
  # ------------------------------------------------------------
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: sflight-db
      - name: sflight-uaa
    build-parameters:
      ignore: ["node_modules/"]


  # ------------------ APPROUTER MODULE ------------------------
  - name: sflight
  # ------------------------------------------------------------
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 1024M
      memory: 512M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: backend # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: sflight-uaa
    provides:
      - name: app-api
        properties:
          url: ${default-url}
    properties:
      CORS: '[{"uriPattern": "^/sap/bc/ina/(.*)$", "allowedOrigin": [{"host":"cap-embedded-test.eu10.analytics.cloud.sap"}], "allowedMethods": ["GET", "POST", "OPTIONS"], "allowedHeaders": ["Origin", "Accept", "X-Requested-With", "Content-Type", "Access-Control-Request-Method", "Access-Control-Request-Headers", "Authorization", "X-Sap-Cid", "X-Csrf-Token", "application-id"], "exposeHeaders": ["Accept", "Authorization", "X-Requested-With", "X-Sap-Cid", "Access-Control-Allow-Origin", "Access-Control-Allow-Credentials", "X-Csrf-Token", "Content-Type"]}]'
      COOKIES: '{"SameSite": "None"}'
      SESSION_TIMEOUT: 120

resources:
  # ------------------------------------------------------------
  - name: sflight-db
  # ------------------------------------------------------------
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-service-name: ${service-name}

  # ------------------------------------------------------------
  - name: sflight-uaa
  # ------------------------------------------------------------
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: sflight-${space}
        tenant-mode: dedicated
        role-collections:
          - name: 'sflight-reviewer-${space}'
            description: Review travels
            role-template-references:
              - $XSAPPNAME.reviewer
          - name: 'sflight-analytics-${space}'
            description: Analyze travels
            role-template-references:
              - $XSAPPNAME.analytics
          - name: 'sflight-analytics-restricted-${space}'
            description: Analyze travels, restricted
            role-template-references:
              - $XSAPPNAME.analytics-restricted
          - name: 'sflight-processor-${space}'
            description: Process travels
            role-template-references:
              - $XSAPPNAME.processor
          - name: 'sflight-admin-${space}'
            description: Manage travels
            role-template-references:
              - $XSAPPNAME.admin